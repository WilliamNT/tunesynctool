name: Update tunesynctool backend API docs

on:
  push:
    branches:
      - main


permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: "webui api schema doc deploy"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: pip install -r requirements.txt

      - run: npm install -g @redocly/cli

      - name: Generate OpenAPI
        env:
          # webui/ on the path so `from webui.api.main import app` resolves,
          # and repo root alongside it so the app's own `from api.core...` imports resolve.
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/webui
          # The app's Config() is instantiated at import time and requires these
          # settings. They're never used to connect during OpenAPI generation
          # (DB engine + Redis client are lazy), so dummy values are safe here.
          DB_HOST: localhost
          DB_USER: root
          DB_NAME: dummy
          APP_HOST: localhost
          APP_SECRET: dummy
          ENCRYPTION_KEY: dummy
          ENCRYPTION_SALT: dummy
        run: |
          mkdir -p static
          python scripts/generate_openapi.py

      - name: Generate ReDoc
        run: |
          mkdir site
          cp openapi.json site/
          redocly build-docs openapi.json -o site/index.html

      - name: Deploy to Cloudflare Workers (static assets)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `wrangler deploy` reads wrangler.jsonc from the repo root, which
          # points at ./site as a static-assets-only Worker.
          command: deploy